.site-footer { background: var(--background); }.footer-inner { min-height: 112px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }.footer-inner strong { font: 800 .87rem var(--font-display); }.footer-inner small, .footer-inner p { color: var(--muted-foreground); font-size: .75rem; }.footer-inner p { margin: 0; }.footer-inner a { display: inline-flex; align-items: center; gap: 7px; color: var(--primary); font-size: .75rem; font-weight: 700; text-decoration: none; white-space: nowrap; }

/* =============================================================================
   CAMADA DE ANIMAÇÃO — sensacao premium, clean e leve
   1. Fundos ambientes (aurora, brilhos, grade)
   2. Revelacao no scroll com stagger
   3. Micro-interacoes (cards, icones, botoes, FAQ)
   4. Ornamentos em movimento
   ============================================================================= */
:root {
  --ease-expo: cubic-bezier(.16, 1, .3, 1);
  --ease-soft: cubic-bezier(.22, 1, .36, 1);
}

/* ---------- 1. FUNDOS ANIMADOS ---------- */
.hero { position: relative; }
.hero::after {
  content: ""; position: absolute; inset: -18%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(34% 32% at 72% 26%, color-mix(in oklab, var(--sage) 30%, transparent), transparent 68%),
    radial-gradient(30% 28% at 88% 62%, color-mix(in oklab, var(--gold) 22%, transparent), transparent 70%),
    radial-gradient(38% 34% at 62% 82%, color-mix(in oklab, var(--primary) 40%, transparent), transparent 72%);
  filter: blur(34px); opacity: .5;
  animation: aurora-drift 30s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes aurora-drift {

.change-inner, .video-layout, .testimonials-section > .container { position: relative; z-index: 1; }

.final-section::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;

.js-reveal:not(.reduced) [data-reveal="zoom"]  { transform: scale(.94); }

const AccordionCtx = createContext({ openValue: null, toggle: () => {} });
const ItemCtx = createContext({ isOpen: false, idBase: "", toggle: () => {} });
let accId = 0;

function Accordion({ type, collapsible, className, children }) {
  const [openValue, setOpenValue] = useState(null);
  const toggle = (v) => setOpenValue((cur) => (cur === v ? (collapsible ? null : cur) : v));
  return (
    <AccordionCtx.Provider value={{ openValue, toggle }}>
      <div className={className} data-orientation="vertical">{children}</div>
    </AccordionCtx.Provider>
  );

function AccordionItem({ value, className, children }) {
  const { openValue, toggle } = useContext(AccordionCtx);
  const isOpen = openValue === value;
  const idBase = useRef("acc-" + ++accId).current;
  return (
    <ItemCtx.Provider value={{ isOpen, idBase, toggle: () => toggle(value) }}>
      <div className={cn("faq-item", className)} data-orientation="vertical" data-state={isOpen ? "open" : "closed"}>
        {children}

    </ItemCtx.Provider>

  const { isOpen, idBase, toggle } = useContext(ItemCtx);

function AccordionContent({ className, children }) {
  const { isOpen, idBase } = useContext(ItemCtx);
  const ref = useRef(null);
  const [gone, setGone] = useState(true);

  useEffect(() => {
    if (isOpen) { setGone(false); return; }
    const t = setTimeout(() => setGone(true), 200);
    return () => clearTimeout(t);
  }, [isOpen]);

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const measure = () => el.style.setProperty("--radix-accordion-content-height", el.scrollHeight + "px");
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [isOpen, children]);

  return (
    <div ref={ref} role="region" id={idBase + "-content"} aria-labelledby={idBase}
      className="faq-content" data-orientation="vertical"
      data-state={isOpen ? "open" : "closed"} hidden={!isOpen && gone}>
      <div className={cn("pb-4 pt-0", className)}>{children}</div>
    </div>
  );
}

/* ---------- src/components/TestimonialsMarquee.tsx ---------- */
const placeholders = ["01", "02", "03", "04", "05"];

function TestimonialsMarquee() {
  const trackRef = useRef(null);
  const groupRef = useRef(null);
  const offsetRef = useRef(0);
  const draggingRef = useRef(false);
  const lastXRef = useRef(0);

  useEffect(() => {
    let frame = 0;
    let lastTime = 0;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const animate = (time) => {
      const width = groupRef.current ? groupRef.current.getBoundingClientRect().width : 0;
      if (width) {
        if (!draggingRef.current && !reduceMotion.matches && lastTime) {
          offsetRef.current -= Math.min(time - lastTime, 64) * 0.025;
        }
        offsetRef.current = ((offsetRef.current % width) + width) % width;
        if (trackRef.current) trackRef.current.style.transform = `translate3d(${-width + offsetRef.current}px,0,0)`;
      }
      lastTime = time;
      frame = requestAnimationFrame(animate);
    };
    frame = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(frame);
  }, []);

  function onPointerDown(event) {
    draggingRef.current = true;
    lastXRef.current = event.clientX;
    event.currentTarget.setPointerCapture(event.pointerId);
  }
  function onPointerMove(event) {
    if (!draggingRef.current) return;
    offsetRef.current += event.clientX - lastXRef.current;
    lastXRef.current = event.clientX;
  }
  function onPointerUp() {
    draggingRef.current = false;
  }

  const cards = (copy) => (
    <div className="testimonial-group" ref={copy === 0 ? groupRef : undefined} aria-hidden={copy !== 1} key={copy}>
      {placeholders.map((item, index) => (
        <div className={`testimonial-placeholder testimonial-placeholder-${index + 1}`} key={item}>
          <div className="testimonial-stars" aria-hidden="true">
            {Array.from({ length: 5 }, (_, star) => <Icon name="star" key={star} size={15} fill="currentColor" />)}
          </div>
          <Icon name="quote" size={37} strokeWidth={1.3} aria-hidden="true" />
          <span>Aguardando print do Google</span>
          <small>AVALIAÇÃO {item}</small>
        </div>
      ))}
    </div>
  );

  return (
    <div className="testimonial-viewport" aria-label="Espaço reservado para avaliações do Google"
      onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp} onLostPointerCapture={onPointerUp}>
      <div ref={trackRef} className="testimonial-track">{[0, 1, 2].map(cards)}</div>
    </div>
  );
}
